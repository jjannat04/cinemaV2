<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinemaSeat - Movie Booking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #e94560;
        }
        .section {
            background: #16213e;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .section h2 {
            margin-bottom: 15px;
            color: #0f3460;
        }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #ff6b6b;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .seat-grid {
            display: grid;
            gap: 5px;
            margin-top: 15px;
        }
        .seat {
            width: 40px;
            height: 40px;
            border: 2px solid #444;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
        }
        .seat.available {
            background: #4ade80;
        }
        .seat.held {
            background: #fbbf24;
        }
        .seat.booked {
            background: #ef4444;
            cursor: not-allowed;
        }
        .seat.selected {
            border: 3px solid #e94560;
        }
        .movie-list, .showtime-list {
            display: grid;
            gap: 10px;
        }
        .movie-card, .showtime-card {
            background: #0f3460;
            padding: 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        .movie-card:hover, .showtime-card:hover {
            background: #1a1a2e;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .status.success {
            background: #065f46;
        }
        .status.error {
            background: #7f1d1d;
        }
        .status.info {
            background: #1e3a5f;
        }
        .loading {
            text-align: center;
            padding: 20px;
        }
        .hidden {
            display: none;
        }
        .booking-form {
            background: #0f3460;
            padding: 15px;
            margin-top: 15px;
            border-radius: 4px;
        }
        .booking-form input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border-radius: 4px;
            border: 1px solid #444;
            background: #1a1a2e;
            color: white;
        }
        .legend {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 CinemaSeat</h1>
        
        <div id="status" class="status info hidden"></div>
        
        <!-- Movies Section -->
        <div class="section" id="movies-section">
            <h2>Select a Movie</h2>
            <div id="movies-list" class="movie-list">
                <div class="loading">Loading movies...</div>
            </div>
        </div>
        
        <!-- Showtimes Section -->
        <div class="section hidden" id="showtimes-section">
            <h2>Select a Showtime</h2>
            <div id="showtimes-list" class="showtime-list">
                <div class="loading">Loading showtimes...</div>
            </div>
        </div>
        
        <!-- Seats Section -->
        <div class="section hidden" id="seats-section">
            <h2>Select Seats</h2>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: #4ade80;"></div>
                    <span>Available</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #fbbf24;"></div>
                    <span>Held</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ef4444;"></div>
                    <span>Booked</span>
                </div>
            </div>
            <div id="seat-grid" class="seat-grid"></div>
            <button id="refresh-seats">Refresh Seats</button>
            
            <div class="booking-form hidden" id="booking-form">
                <h3>Book Selected Seat</h3>
                <p id="selected-seat-info"></p>
                <input type="text" id="phone" placeholder="Phone number for OTP">
                <button id="hold-seat">Hold Seat</button>
                <button id="pay-seat" disabled>Pay for Seat</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let selectedMovie = null;
        let selectedShowtime = null;
        let selectedSeat = null;
        let currentHoldId = null;
        let userId = 'user_' + Math.random().toString(36).substr(2, 9);

        function showStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.classList.remove('hidden');
            setTimeout(() => status.classList.add('hidden'), 5000);
        }

        async function fetchMovies() {
            try {
                const response = await fetch(`${API_BASE}/movies`);
                const movies = await response.json();
                
                const moviesList = document.getElementById('movies-list');
                moviesList.innerHTML = movies.map(movie => `
                    <div class="movie-card" onclick="selectMovie(${movie.id}, '${movie.title}')">
                        <h3>${movie.title}</h3>
                        <p>${movie.description || 'No description'}</p>
                        <p>Duration: ${movie.duration_minutes} minutes</p>
                    </div>
                `).join('');
            } catch (error) {
                showStatus('Failed to load movies', 'error');
            }
        }

        async function selectMovie(movieId, movieTitle) {
            selectedMovie = { id: movieId, title: movieTitle };
            document.getElementById('showtimes-section').classList.remove('hidden');
            document.getElementById('showtimes-list').innerHTML = '<div class="loading">Loading showtimes...</div>';
            await fetchShowtimes(movieId);
        }

        async function fetchShowtimes(movieId) {
            try {
                const response = await fetch(`${API_BASE}/movies/${movieId}/showtimes`);
                const showtimes = await response.json();
                
                const showtimesList = document.getElementById('showtimes-list');
                showtimesList.innerHTML = showtimes.map(showtime => `
                    <div class="showtime-card" onclick="selectShowtime(${showtime.id}, '${showtime.start_time}')">
                        <h3>${new Date(showtime.start_time).toLocaleString()}</h3>
                        <p>Price: $${showtime.price}</p>
                    </div>
                `).join('');
            } catch (error) {
                showStatus('Failed to load showtimes', 'error');
            }
        }

        async function selectShowtime(showtimeId, startTime) {
            selectedShowtime = { id: showtimeId, start_time: startTime };
            document.getElementById('seats-section').classList.remove('hidden');
            await fetchSeats(showtimeId);
        }

        async function fetchSeats(showtimeId) {
            try {
                const response = await fetch(`${API_BASE}/seats/${showtimeId}`);
                const data = await response.json();
                
                const seatGrid = document.getElementById('seat-grid');
                const seatsByRow = {};
                
                data.seats.forEach(seat => {
                    if (!seatsByRow[seat.row_letter]) {
                        seatsByRow[seat.row_letter] = [];
                    }
                    seatsByRow[seat.row_letter].push(seat);
                });
                
                // Sort rows and seats
                const sortedRows = Object.keys(seatsByRow).sort();
                seatGrid.innerHTML = sortedRows.map(row => {
                    const sortedSeats = seatsByRow[row].sort((a, b) => a.seat_number - b.seat_number);
                    return `
                        <div style="display: flex; gap: 5px; margin-bottom: 5px;">
                            <span style="width: 30px; display: flex; align-items: center;">${row}</span>
                            ${sortedSeats.map(seat => `
                                <div class="seat ${seat.status.toLowerCase()} ${selectedSeat && selectedSeat.id === seat.id ? 'selected' : ''}" 
                                     onclick="selectSeat(${seat.id}, '${seat.row_letter}', ${seat.seat_number}, '${seat.status}')"
                                     data-seat-id="${seat.id}">
                                    ${seat.seat_number}
                                </div>
                            `).join('')}
                        </div>
                    `;
                }).join('');
                
            } catch (error) {
                showStatus('Failed to load seats', 'error');
            }
        }

        function selectSeat(seatId, rowLetter, seatNumber, status) {
            if (status !== 'available') {
                showStatus('Seat is not available', 'error');
                return;
            }
            
            selectedSeat = { id: seatId, row_letter: rowLetter, seat_number: seatNumber };
            document.getElementById('selected-seat-info').textContent = `Selected: ${rowLetter}${seatNumber}`;
            document.getElementById('booking-form').classList.remove('hidden');
            document.getElementById('pay-seat').disabled = true;
            document.getElementById('hold-seat').disabled = false;
            
            // Update visual selection
            document.querySelectorAll('.seat').forEach(seat => seat.classList.remove('selected'));
            document.querySelector(`[data-seat-id="${seatId}"]`).classList.add('selected');
        }

        async function holdSeat() {
            if (!selectedSeat || !selectedShowtime) return;
            
            const phone = document.getElementById('phone').value;
            if (!phone) {
                showStatus('Please enter phone number', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/seats/${selectedShowtime.id}/hold`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        seat_id: selectedSeat.id,
                        user_identifier: userId
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    currentHoldId = data.hold_id;
                    showStatus(`Seat held! Expires at ${new Date(data.hold_expires_at).toLocaleString()}`, 'success');
                    document.getElementById('hold-seat').disabled = true;
                    document.getElementById('pay-seat').disabled = false;
                    await fetchSeats(selectedShowtime.id);
                } else {
                    const error = await response.json();
                    showStatus(error.detail || 'Failed to hold seat', 'error');
                }
            } catch (error) {
                showStatus('Failed to hold seat', 'error');
            }
        }

        async function payForSeat() {
            if (!currentHoldId) return;
            
            const phone = document.getElementById('phone').value;
            // IMPORTANT: Use the Docker service name "app" instead of localhost
            // The gateway container needs to reach our app container
            const callbackUrl = `${API_BASE.replace('localhost', 'app')}/bookings/callback`;
            
            try {
                const response = await fetch(`${API_BASE}/bookings/${currentHoldId}/pay`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        hold_id: currentHoldId,
                        phone: phone,
                        callback_url: callbackUrl
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    showStatus(`Payment initiated! Booking ID: ${data.booking_id}. Waiting for confirmation...`, 'success');
                    document.getElementById('pay-seat').disabled = true;
                    
                    // Poll for booking status
                    setTimeout(checkBookingStatus, 3000, data.booking_id);
                } else {
                    const error = await response.json();
                    showStatus(error.detail || 'Failed to initiate payment', 'error');
                }
            } catch (error) {
                showStatus('Failed to initiate payment', 'error');
            }
        }

        async function checkBookingStatus(bookingId) {
            try {
                const response = await fetch(`${API_BASE}/bookings/${bookingId}`);
                const booking = await response.json();
                
                if (booking.status === 'confirmed') {
                    showStatus('Payment successful! Seat booked!', 'success');
                    await fetchSeats(selectedShowtime.id);
                } else if (booking.status === 'failed') {
                    showStatus('Payment failed. Please try again.', 'error');
                    await fetchSeats(selectedShowtime.id);
                } else {
                    // Still pending, check again
                    setTimeout(checkBookingStatus, 3000, bookingId);
                }
            } catch (error) {
                showStatus('Failed to check booking status', 'error');
            }
        }

        // Event listeners
        document.getElementById('refresh-seats').addEventListener('click', () => {
            if (selectedShowtime) fetchSeats(selectedShowtime.id);
        });
        
        document.getElementById('hold-seat').addEventListener('click', holdSeat);
        document.getElementById('pay-seat').addEventListener('click', payForSeat);

        // Initialize
        fetchMovies();
    </script>
</body>
</html>
